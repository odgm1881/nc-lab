# Запуск: docker compose -f docker-compose.yml -f docker-compose.staging.yml --env-file ../.env.staging up -d
services:
  db:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports: []

  api:
    environment:
      DATABASE_URL: postgresql+psycopg://nklab:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/nklab
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      APP_ENV: staging
      APP_VERSION: ${APP_VERSION:?APP_VERSION is required}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      DEMO_ACCOUNTS_ENABLED: "false"
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      MAX_IMPORT_ROWS: ${MAX_IMPORT_ROWS:-5000}
      METRICS_TOKEN: ${METRICS_TOKEN:?METRICS_TOKEN is required}
      AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-20}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:?S3_ENDPOINT_URL is required}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
      S3_REGION: ${S3_REGION:-ru-central1}
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports: []

  web:
    ports:
      - "${WEB_PORT:-8080}:80"

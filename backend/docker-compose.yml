# Полный контур этапа 1: web (nginx+фронтенд) + api (FastAPI) + db (PostgreSQL).
# После старта открывайте кабинет на http://localhost:8080
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: nklab
      POSTGRES_PASSWORD: password
      POSTGRES_DB: nklab
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nklab"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://nklab:password@db:5432/nklab
      JWT_SECRET: ${JWT_SECRET:-change-me}
      APP_ENV: development
      DEMO_ACCOUNTS_ENABLED: "true"
    depends_on:
      db:
        condition: service_healthy
    # Применяем миграции и заполняем демо-данными (идемпотентно), затем запускаем API.
    command: >
      sh -c "alembic upgrade head &&
             python -m app.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/ready')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  web:
    build: ../frontend
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  pgdata:

# Минимальный контур этапа 1: api + db + nginx (см. STACK.md).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: nklab
      POSTGRES_PASSWORD: password
      POSTGRES_DB: nklab
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nklab"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://nklab:password@db:5432/nklab
      JWT_SECRET: ${JWT_SECRET:-change-me}
      APP_ENV: production
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"

volumes:
  pgdata:

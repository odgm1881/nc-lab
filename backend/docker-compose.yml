# Полный контур этапа 1: web (nginx+фронтенд) + api (FastAPI) + db (PostgreSQL).
# После старта открывайте кабинет на http://localhost:8080
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: nklab
      POSTGRES_PASSWORD: password
      POSTGRES_DB: nklab
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nklab"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://nklab:password@db:5432/nklab
      JWT_SECRET: ${JWT_SECRET:-change-me}
      APP_ENV: production
    depends_on:
      db:
        condition: service_healthy
    # Применяем миграции и заполняем демо-данными (идемпотентно), затем запускаем API.
    command: >
      sh -c "alembic upgrade head &&
             python -m app.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"

  web:
    build: ../frontend
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  pgdata:

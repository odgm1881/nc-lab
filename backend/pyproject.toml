[project]
name = "nk-lab-backend"
version = "0.1.0"
description = "НК-ЛАБ — платформа подготовки и валидации карточек товаров для Национального каталога и маркировки"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "python-multipart>=0.0.12",
    "openpyxl>=3.1",
    "boto3>=1.35",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.2",
]
dev = [
    "ruff>=0.7",
    "pytest>=8.3",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["migrations"]  # автогенерируемый код Alembic не линтуем

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["B008"]  # FastAPI Depends() в аргументах по умолчанию — это нормально

[tool.pytest.ini_options]
testpaths = ["app/tests"]
pythonpath = ["."]

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nklab
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: nklab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nklab"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://nklab:test-password@localhost:5432/nklab_test
      JWT_SECRET: ci-only-secret
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - working-directory: backend
        run: uv sync --extra dev --extra postgres --locked
      - working-directory: backend
        run: uv run ruff check .
      - working-directory: backend
        run: uv run pytest
      - working-directory: backend
        run: |
          uv run alembic upgrade head
          uv run alembic check

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run lint
      - working-directory: frontend
        run: npm run build
      - working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: nk-lab-api:ci
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          tags: nk-lab-web:ci
